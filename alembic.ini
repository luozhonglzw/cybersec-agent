# Alembic configuration (Phase v0.2.0-M1a)
#
# NOTE: this file is deliberately ASCII-only. Alembic reads it with the
# *locale* encoding (configparser default), which on this Windows host is GBK;
# non-ASCII comments would raise UnicodeDecodeError before anything else runs.
#
# The connection URL is deliberately EMPTY. migrations/env.py reads the
# migration DSN from the CYBERSEC_PG_MIGRATION_DSN environment variable, so no
# credential ever lives in a tracked file.
#
# Migrations MUST run as the migration-owner role (cybersec_migrator), never as
# the application-runtime role (cybersec_app). The baseline migration contains
# an explicit guard that refuses to run as cybersec_app.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
