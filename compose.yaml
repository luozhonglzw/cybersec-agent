# CyberSec Agent - minimal local Compose topology (Phase 9.3-G)
#
# Exactly one service and one named volume:
#   - api          : the HTTP/FastAPI container
#   - audit-data   : mutable SQLite state (audit + HITL checkpoints), at /data
#
# The baked synthetic demo data lives at /app/data (inside the image) and is
# deliberately NOT on the volume, so it is never shadowed by the mount.
# MCP stays local stdio (`python -m app.mcp.server`) and is not a service here.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      AUDIT_DB_PATH: /data/audit.db
      # v0.4.0 S1 — durable HITL checkpoints. Deliberately a DIFFERENT file from
      # the audit database: the two are independent stores (the audit log is
      # authoritative for what happened, the checkpoint store for whether a run
      # can continue), and Settings refuses at startup if both point at one path.
      # They share the volume because both must survive a container restart.
      CHECKPOINT_DB_PATH: /data/checkpoints.db
    volumes:
      - audit-data:/data

volumes:
  audit-data:
