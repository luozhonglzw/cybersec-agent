[project]
name = "cybersec-agent"
version = "0.1.0"
description = "CyberSec Agent - 基于 LangGraph + MCP 的智能网络安全运营 Agent 平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "langchain-openai>=0.2,<1",
    "langchain-core>=0.2,<1",
    "structlog>=24.1,<26",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pytest-asyncio>=1.4.0",
    "langgraph>=1.0.1",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
